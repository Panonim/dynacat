build_from:
  amd64: ghcr.io/home-assistant/amd64-base:3.19
  aarch64: ghcr.io/home-assistant/aarch64-base:3.19
  armv7: ghcr.io/home-assistant/armv7-base:3.19
args:
  DYNGLANCE_REPO: https://github.com/trooperthorn/ha_app_dynglance.git
  DYNGLANCE_REF: main
  # Keep in sync with the `version:` field in config.yaml - Supervisor's
  # builder doesn't template this from config.yaml automatically, so both
  # need to be bumped together when cutting a new add-on release.
  APP_VERSION: "2026.08.23.1"
