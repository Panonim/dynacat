name: DynGlance
version: "2026.08.23.4"
slug: dynglance
description: Self-hosted dashboard (Glance fork) with dynamic widgets, run as a Home Assistant add-on
url: https://github.com/trooperthorn/ha_app_dynglance
webui: "http://[HOST]:[PORT:8080]/"
startup: application
boot: auto
init: false
arch:
  - amd64
  - aarch64

# Forces the security rating to 1 when true; only docker-containers and
# docker-controller widgets need it. See docs/docs/home-assistant.md.
docker_api: false

ingress: true
ingress_port: 8080
panel_icon: mdi:view-dashboard
panel_title: DynGlance

ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "DynGlance web UI (only needed for direct/non-Ingress access, e.g. from outside Home Assistant)"

# See "The add-on's three mapped directories" in docs/docs/home-assistant.md.
map:
  - addon_config:rw
  - share:ro
  - homeassistant_config:ro

options:
  log_level: info
  timezone: ""
  home_assistant_token: ""
  config_upload_enabled: false
  config_upload_password: ""

schema:
  log_level: list(debug|info|warning|error)
  timezone: str?
  # Passed through as the HA_TOKEN env var. See docs/docs/home-assistant.md.
  home_assistant_token: password?
  # See "Config Upload" in docs/docs/authentication.md.
  config_upload_enabled: bool
  config_upload_password: password?
