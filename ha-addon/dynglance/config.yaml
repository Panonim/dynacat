name: DynGlance
version: "1.0.0"
slug: dynglance
description: Self-hosted dashboard (Glance fork) with dynamic widgets, run as a Home Assistant add-on
url: https://github.com/trooperthorn/ha_app_dynglance
webui: "http://[HOST]:[PORT:8080]/"
startup: application
boot: auto
init: false
arch:
  - amd64
  - aarch64
  - armv7

# Grants access to /var/run/docker.sock so the docker-containers and
# docker-controller widgets work out of the box. This is equivalent to full
# root access to the host - disable it (set to false and rebuild/reinstall)
# if you don't use those widgets and want to reduce the add-on's privileges.
docker_api: true

# Lets custom-api widgets reach the Home Assistant Core API at
# http://supervisor/core/api/... using the auto-injected SUPERVISOR_TOKEN,
# so dashboard entities can be displayed without creating a separate
# long-lived access token. See docs/docs/home-assistant.md.
homeassistant_api: true

ingress: true
ingress_port: 8080
panel_icon: mdi:view-dashboard
panel_title: DynGlance

ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "DynGlance web UI (only needed for direct/non-Ingress access, e.g. from outside Home Assistant)"

# addon_config -> /config: where dynglance.yml, custom CSS/assets and themes live.
#   Editable from the Studio Code Server / File editor add-ons.
# share -> /share: optional, only useful if widgets need to read files that
#   already live in Home Assistant's shared folder (e.g. bookmarked local docs).
# homeassistant_config -> /homeassistant, read-only: lets dynglance.yml's
#   `$include` reference YAML files that already live in your main Home
#   Assistant config folder (e.g. a `dynglance-widgets.yml` you keep next to
#   your other packages), instead of duplicating them under /config. See
#   docs/docs/home-assistant.md.
map:
  - addon_config:rw
  - share:rw
  - homeassistant_config:ro

options:
  log_level: info
  timezone: ""

schema:
  log_level: list(debug|info|warning|error)
  timezone: str?
